[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision-ai"
version = "0.1.0"
description = "Research and educational clinical decision-support prototype for explainable medical image analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "torch>=2.2.0,<3.0.0",
    "torchvision>=0.17.0,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "pillow>=10.0.0,<11.0.0",
    "kaggle>=1.6.0,<2.0.0",
    "mlflow>=2.10.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "grad-cam>=1.5.0,<2.0.0",
    "pydicom>=2.4.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pwdlib[argon2]>=0.2.0,<1.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "email-validator>=2.1.0",
    "reportlab>=4.1.0",
    "python-json-logger>=2.0.7",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "dvc>=3.60.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["app"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
