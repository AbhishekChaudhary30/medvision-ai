services:
  postgres:
    image: postgres:16-alpine
    container_name: medvision-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-medvision_app}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medvision_app} -d ${POSTGRES_DB:-medvision_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: medvision-backend
    environment:
      APP_NAME: ${APP_NAME:-MedVision AI}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://medvision_app@postgres:5432/medvision_ai}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
